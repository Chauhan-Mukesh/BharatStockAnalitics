version: "3.9"

services:
  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bharatstocks_postgres
    environment:
      POSTGRES_USER: bharatstocks
      POSTGRES_PASSWORD: bharatstocks
      POSTGRES_DB: bharatstocks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatstocks"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Redis
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bharatstocks_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Ollama (local LLM)
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: bharatstocks_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Pull the default model on startup
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2:7b && wait"]

  # -------------------------------------------------------------------------
  # Backend API
  # -------------------------------------------------------------------------
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: bharatstocks_api
    environment:
      DATABASE_URL: "******postgres:5432/bharatstocks"
      REDIS_URL: "redis://redis:6379/0"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2:7b"
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # DB migrations (runs once then exits)
  # -------------------------------------------------------------------------
  migrations:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: bharatstocks_migrations
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "******postgres:5432/bharatstocks"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------------
  # Celery Worker + Beat
  # -------------------------------------------------------------------------
  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: bharatstocks_worker
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "******postgres:5432/bharatstocks"
      API_BASE_URL: "http://backend-api:8000"
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Nginx reverse proxy
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: bharatstocks_nginx
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
