name: BharatStocks CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + tests
  # ---------------------------------------------------------------------------
  backend:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          cd backend-api
          pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check backend-api/app workers

      - name: Run analytics unit tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: "sqlite:///./test.db"
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Android: build check (assembleDebug)
  # ---------------------------------------------------------------------------
  android:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Android unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest --no-daemon

  # ---------------------------------------------------------------------------
  # Docker build check
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t bharatstocks-api:ci ./backend-api

      - name: Build workers Docker image
        run: docker build -t bharatstocks-worker:ci ./workers

      - name: Validate docker-compose
        run: docker compose config --quiet
